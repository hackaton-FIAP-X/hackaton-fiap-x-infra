apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay local (kind). Segredos vêm de um .env NÃO versionado (ver .env.example).
# Imagens são construídas localmente (scripts/build-images.sh) e injetadas no
# cluster com `kind load` — sem depender do GHCR (push pro GHCR é PLT-6).
# O Namespace é aplicado pelos scripts (kubectl apply -f k8s/namespace.yaml).

namespace: fiapx

resources:
  - ../../base

secretGenerator:
  - name: app-credentials
    envs:
      - .env

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: fiapx

images:
  - name: ghcr.io/hackaton-fiap-x/auth-service
    newTag: local
  - name: ghcr.io/hackaton-fiap-x/video-service
    newTag: local
  - name: ghcr.io/hackaton-fiap-x/video-processor
    newTag: local

# PLT-3 — video-service com 2 replicas; video-processor comeca no piso do HPA
# (2) e o autoscaler assume a partir dai.
replicas:
  - name: video-service
    count: 2
  - name: video-processor
    count: 2

patches:
  # A imagem é construída localmente, então nunca puxar do registry.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # auth-service e video-processor ainda usam o Dockerfile de dev, que roda
  # `mvnw spring-boot:run` como root e escreve em /app. Relaxamos non-root
  # só neles; a postura endurecida continua na base como intenção de produção.
  # Sai daqui quando AUTH-8 e WRK-9 entregarem a imagem multi-stage —
  # o video-service já saiu, porque a VID-11 entregou a dele.
  - target:
      kind: Deployment
      name: auth-service|video-processor
    patch: |-
      - op: replace
        path: /spec/template/spec/securityContext/runAsNonRoot
        value: false
