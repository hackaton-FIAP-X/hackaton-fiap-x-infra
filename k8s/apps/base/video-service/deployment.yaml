apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-service
  labels:
    app.kubernetes.io/name: video-service
    app.kubernetes.io/part-of: fiapx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-service
        app.kubernetes.io/part-of: fiapx
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      securityContext:
        runAsNonRoot: true
        # UID/GID numericos sao obrigatorios: as imagens declaram USER por nome
        # (spring, fiapx) e com runAsNonRoot o kubelet recusa o pod quando nao
        # consegue provar que o usuario nao e root. Os arquivos da aplicacao sao
        # legiveis por todos (644) e a JVM so escreve em /tmp.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: video-service
          image: ghcr.io/hackaton-fiap-x/video-service:local
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: video-service-config
            - secretRef:
                name: app-credentials
          # VID-10/VID-11 habilitaram management.endpoint.health.probes:
          # readiness inclui `db`, entao o pod so entra no Service com o banco de pe.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
