apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processor
  labels:
    app.kubernetes.io/name: video-processor
    app.kubernetes.io/part-of: fiapx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-processor
        app.kubernetes.io/part-of: fiapx
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8082"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: video-processor
          image: ghcr.io/hackaton-fiap-x/video-processor:local
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: video-processor-config
            - secretRef:
                name: app-credentials
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
