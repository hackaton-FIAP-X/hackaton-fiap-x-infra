apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processor
  labels:
    app.kubernetes.io/name: video-processor
    app.kubernetes.io/part-of: fiapx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-processor
        app.kubernetes.io/part-of: fiapx
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8082"
    spec:
      securityContext:
        runAsNonRoot: true
        # UID/GID numericos sao obrigatorios: as imagens declaram USER por nome
        # (spring, fiapx) e com runAsNonRoot o kubelet recusa o pod quando nao
        # consegue provar que o usuario nao e root. Os arquivos da aplicacao sao
        # legiveis por todos (644) e a JVM so escreve em /tmp.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: video-processor
          image: ghcr.io/hackaton-fiap-x/video-processor:local
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: video-processor-config
            - secretRef:
                name: app-credentials
          # WRK-8/WRK-10: readiness inclui a conexao com o RabbitMQ
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            # videos baixados e frames extraidos; apagados ao fim de cada video (WRK-2)
            - name: work
              mountPath: /work
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 4Gi
