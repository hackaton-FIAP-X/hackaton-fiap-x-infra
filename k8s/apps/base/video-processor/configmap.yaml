apiVersion: v1
kind: ConfigMap
metadata:
  name: video-processor-config
  labels:
    app.kubernetes.io/name: video-processor
    app.kubernetes.io/part-of: fiapx
# Chaves conforme video-processor/src/main/resources/application.yml (WRK-1..WRK-10).
# Segredos (RABBITMQ_USER/PASS, STORAGE_ACCESS_KEY/SECRET_KEY) vem do app-credentials.
data:
  SPRING_PROFILES_ACTIVE: "k8s"

  RABBITMQ_HOST: "rabbitmq.fiapx.svc.cluster.local"
  RABBITMQ_PORT: "5672"

  # Mesmo bucket e prefixos do video-service (fiapx/inputs, fiapx/outputs)
  STORAGE_ENDPOINT: "http://minio.fiapx.svc.cluster.local:9000"
  STORAGE_BUCKET: "fiapx"
  STORAGE_REGION: "us-east-1"

  # Um video por vez por pod: a escala vem do HPA, nao de threads (WRK-1)
  PROCESSOR_CONCURRENCY: "1"
  PROCESSOR_WORK_DIR: "/work"
