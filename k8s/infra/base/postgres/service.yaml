apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fiapx
spec:
  # Headless: DNS estável postgres-0.postgres.fiapx.svc.cluster.local
  # e também resolve postgres.fiapx.svc.cluster.local para o pod.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
