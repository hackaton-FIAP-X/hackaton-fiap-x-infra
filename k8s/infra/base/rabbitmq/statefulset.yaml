apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: fiapx
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: fiapx
      annotations:
        # plugin rabbitmq_prometheus ja vem habilitado na imagem -management
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "15692"
    spec:
      securityContext:
        fsGroup: 999
        # Sem isso o kubelet reaplica o grupo em TODO o volume a cada mount e
        # devolve permissao de grupo ao .erlang.cookie; o Erlang so aceita o
        # cookie acessivel pelo dono ("must be accessible by owner only") e o
        # RabbitMQ nao sobe. So aparece em volume que sobrevive ao pod (EBS).
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: metrics
              containerPort: 15692
          env:
            # O cookie do Erlang mora no HOME. Deixando o HOME num emptyDir, ele
            # nasce a cada start com a permissao certa (400) e nunca e tocado
            # pelo fsGroup do volume persistente — era isso que derrubava o
            # RabbitMQ no EBS ("cookie file must be accessible by owner only").
            # Os dados (mnesia) continuam no volume `data`, entao nada se perde.
            - name: HOME
              value: /home/rabbitmq
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: infra-credentials
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: infra-credentials
                  key: RABBITMQ_DEFAULT_PASS
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: home
              mountPath: /home/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "status"]
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: home
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
