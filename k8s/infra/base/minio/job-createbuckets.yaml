apiVersion: batch/v1
kind: Job
metadata:
  name: minio-createbuckets
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: fiapx
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-createbuckets
        app.kubernetes.io/part-of: fiapx
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-10-08T09-37-26Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: infra-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infra-credentials
                  key: MINIO_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              set -e
              until mc alias set local http://minio.fiapx.svc.cluster.local:9000 \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "aguardando MinIO..."; sleep 3
              done
              # Bucket unico. Os prefixos inputs/ e outputs/ sao criados pelo
              # proprio app (ver storage_key/zip_key em V1__criar_tabela_videos.sql).
              mc mb --ignore-existing local/fiapx
              mc ls local
              echo "bucket pronto: fiapx"
