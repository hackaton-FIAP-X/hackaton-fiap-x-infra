apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Na AWS, Postgres, Redis e S3 sao gerenciados (terraform/aws). No cluster ficam
# o RabbitMQ (o Learner Lab nega o Amazon MQ, ver ADR-002), com volume EBS gp3,
# o Mailhog e o Secret infra-credentials (RabbitMQ e Grafana).
namespace: fiapx

resources:
  - storageclass-gp3.yaml
  - ../../base/rabbitmq
  - ../../base/mailhog

patches:
  - target:
      kind: StatefulSet
      name: rabbitmq
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3

secretGenerator:
  - name: infra-credentials
    envs:
      - generated/infra.env # scripts/aws-render.sh

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: fiapx
