apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Na AWS, Postgres, RabbitMQ, Redis e S3 sao gerenciados (terraform/aws). No
# cluster so fica o Mailhog, e o Secret infra-credentials que o Grafana usa.
namespace: fiapx

resources:
  - ../../base/mailhog

secretGenerator:
  - name: infra-credentials
    envs:
      - generated/infra.env # scripts/aws-render.sh

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: fiapx
