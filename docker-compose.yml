# PLT-4 — ambiente de desenvolvimento completo sem Kubernetes.
#
# Caminho rapido para desenvolver: sobe infra de apoio + os tres servicos.
#
# Os servicos usam as MESMAS imagens do kind (ghcr.io/hackaton-fiap-x/*:local),
# construidas por ./scripts/build-images.sh — `make compose-up` ja faz isso.
# Nao ha `build:` aqui de proposito: o build do video-service precisa do
# security-commons injetado (ver build-images.sh) e o compose nao sabe fazer.
# Para a demo de escalabilidade (Ingress/HPA) use o kind: ./scripts/kind-up.sh
#
#   cd infra
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#
# Painels:  RabbitMQ http://localhost:15672 | MinIO http://localhost:9001
#           Mailhog  http://localhost:8025

name: fiapx

services:
  # ----------------------------------------------------------------- infra ---
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # mesmo script de init usado pelo ConfigMap do k8s
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d postgres']
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports: ['5672:5672', '15672:15672']
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ['9000:9000', '9001:9001']
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-createbuckets:
    image: quay.io/minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/fiapx &&
        echo 'bucket pronto: fiapx'
      "
    restart: 'no'

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports: ['6379:6379']
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ['1025:1025', '8025:8025']

  # --------------------------------------------------------------- servicos ---
  auth-service:
    image: ghcr.io/hackaton-fiap-x/auth-service:local
    ports: ['8080:8080']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: authdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # rate limit do login (AUTH-6)
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      # obrigatorios — o servico nao inicia sem eles (./scripts/gen-jwt-keys.sh)
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    restart: unless-stopped

  video-service:
    image: ghcr.io/hackaton-fiap-x/video-service:local
    # O app escuta 8080 dentro do container, que e a porta que o HEALTHCHECK
    # do Dockerfile dele (VID-11) testa. No host fica 8081.
    ports: ['8081:8080']
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: videodb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: fiapx
      JWT_JWKS_URI: http://auth-service:8080/.well-known/jwks.json
      JWT_ISSUER: fiapx-auth
    restart: unless-stopped

  video-processor:
    image: ghcr.io/hackaton-fiap-x/video-processor:local
    ports: ['8082:8082']
    depends_on:
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: fiapx
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  redis-data:
