name: CD

# PLT-6 — entrega continua.
#
# Polyrepo: o infra orquestra. A cada merge na main (do infra, ou disparado por
# um servico via repository_dispatch), este workflow:
#   1. faz checkout do infra e dos 3 servicos lado a lado, como no workspace local;
#   2. constroi as 3 imagens com os mesmos scripts do `make up`;
#   3. sobe um kind efemero, aplica todos os manifests (incluindo Prometheus e
#      Grafana) e roda o scripts/verify.sh como smoke test — o mesmo que um dev
#      roda na maquina. O smoke test falha se alguma checagem for pulada;
#   4. se passou, e e a main, publica no ECR e faz o deploy no EKS da AWS
#      (scripts/aws-up.sh), com o verify.sh rodando la tambem. So ATUALIZA um
#      ambiente que ja esta no ar: criar/destruir e pelo workflow "AWS - ambiente",
#      para um merge nao ligar o EKS sozinho e gastar o credito do Learner Lab.
#
# Secrets do repo infra (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN
#     credenciais da sessao do Learner Lab (AWS Details -> AWS CLI). Expiram a
#     cada sessao: atualize ao abrir o lab. Sem elas o passo 4 e pulado.
#   SERVICES_READ_TOKEN (opcional) — leitura dos repos dos servicos, so se algum
#     deles ficar privado.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      auth_ref:
        description: Branch/tag/SHA do auth-service (valida um PR antes do merge)
        default: main
      video_ref:
        description: Branch/tag/SHA do video-service
        default: main
      processor_ref:
        description: Branch/tag/SHA do video-processor
        default: main
  # um servico pode disparar o CD apos o merge dele:
  #   gh api repos/hackaton-FIAP-X/hackaton-fiap-x-infra/dispatches -f event_type=service-updated
  repository_dispatch:
    types: [service-updated]

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  ORG: hackaton-FIAP-X
  # secrets nao podem aparecer em `if:`; o job le daqui se ha credencial da AWS
  HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}

jobs:
  deliver:
    name: build, kind efemero e deploy na AWS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Checkout auth-service
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/hackaton-fiap-x-auth-service
          ref: ${{ inputs.auth_ref || 'main' }}
          token: ${{ secrets.SERVICES_READ_TOKEN || github.token }}
          path: auth-service

      - name: Checkout video-service
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/hackaton-fiap-x-video-service
          ref: ${{ inputs.video_ref || 'main' }}
          token: ${{ secrets.SERVICES_READ_TOKEN || github.token }}
          path: video-service

      - name: Checkout video-processor
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/hackaton-fiap-x-video-processor
          ref: ${{ inputs.processor_ref || 'main' }}
          token: ${{ secrets.SERVICES_READ_TOKEN || github.token }}
          path: video-processor

      - name: SHAs de cada repositorio
        id: sha
        run: |
          short() { git -C "$1" rev-parse --short=12 HEAD; }
          echo "infra=$(short infra)" >> "$GITHUB_OUTPUT"
          {
            echo "### Commits entregues"
            for r in infra auth-service video-service video-processor; do
              echo "- \`$r\`: \`$(short $r)\` $(git -C $r log -1 --format=%s)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Instala kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.24.0

      - name: Gera .env efemero (segredos aleatorios, nunca versionados)
        working-directory: infra
        run: ./scripts/gen-env.sh

      - name: Build das imagens
        working-directory: infra
        run: ./scripts/build-images.sh

      - name: Sobe kind efemero
        working-directory: infra
        run: ./scripts/kind-up.sh

      - name: Add-ons (Ingress NGINX + metrics-server)
        working-directory: infra
        run: ./scripts/deploy-addons.sh

      - name: Carrega as imagens no kind
        working-directory: infra
        run: ./scripts/load-images.sh

      - name: Deploy da infra de apoio
        working-directory: infra
        run: ./scripts/deploy-infra.sh

      - name: Deploy dos servicos
        working-directory: infra
        run: ./scripts/deploy-apps.sh

      - name: Deploy da observabilidade (Prometheus + Grafana)
        working-directory: infra
        # Precisa do Secret infra-credentials (senha do Grafana), criado no
        # deploy da infra. Sem este passo o verify.sh pula as checagens do PLT-7.
        run: ./scripts/deploy-observability.sh

      - name: Deploy do Ingress
        working-directory: infra
        run: ./scripts/deploy-ingress.sh

      - name: Smoke test (scripts/verify.sh)
        working-directory: infra
        run: |
          set -o pipefail
          ./scripts/verify.sh | tee verify.log
          # verde com checagem pulada nao vale: o CD sobe tudo, entao nada pode
          # ser PULADO. Protege contra um passo de deploy removido por engano.
          if sed 's/\x1b\[[0-9;]*m//g' verify.log | grep -q 'PULADO'; then
            echo "::error::verify.sh pulou checagens — algum componente nao foi aplicado"
            grep 'PULADO' verify.log
            exit 1
          fi
          {
            echo "### Smoke test"
            echo "$(sed 's/\x1b\[[0-9;]*m//g' verify.log | grep -c 'OK  -') checagens OK, nenhuma pulada."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Instala Terraform (deploy na AWS)
        if: env.HAS_AWS == 'true' && github.ref == 'refs/heads/main'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Deploy na AWS (atualiza o ambiente se estiver no ar)
        if: env.HAS_AWS == 'true' && github.ref == 'refs/heads/main'
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          # as imagens :local ja foram construidas e testadas no kind acima
          ONLY_IF_UP=1 SKIP_BUILD=1 IMAGE_TAG="${{ steps.sha.outputs.infra }}-${{ github.run_number }}" \
            ./scripts/aws-up.sh

      - name: Deploy na AWS pulado
        if: env.HAS_AWS != 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "::notice::Deploy na AWS pulado: cadastre AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e AWS_SESSION_TOKEN nos secrets do repo infra."

      - name: Diagnostico em caso de falha
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n fiapx get events --sort-by=.lastTimestamp | tail -40 || true
          for d in auth-service video-service video-processor prometheus grafana; do
            echo "::group::logs $d"
            kubectl -n fiapx logs deploy/$d --tail=80 || true
            echo "::endgroup::"
          done
